# Varredura de segurança: segredos, dependências, código e container.
#
# Cada etapa é independente e nenhuma bloqueia a próxima, porque o valor está
# no relatório completo. O que bloqueia é o gate no fim, e só por segredo
# vazado — o único achado que não pode esperar a próxima sprint.
name: security

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner em JSON. O padrao e o self-hosted do homelab: minuto de
          self-hosted e gratuito e nao consome a cota de 2.000/mes do GitHub.
        type: string
        default: '["self-hosted","homelab"]'
      sonar_host:
        description: URL do SonarQube; vazio desliga a etapa
        type: string
        default: ""
      defectdojo_host:
        description: URL do DefectDojo; vazio desliga o envio
        type: string
        default: ""
      product_name:
        type: string
        default: ${{ github.event.repository.name }}
    secrets:
      SONAR_TOKEN:
        required: false
      DEFECTDOJO_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  segredos:
    name: segredos vazados
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      vazou: ${{ steps.gitleaks.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # O binario, nao a acao: gitleaks-action@v2 exige licenca paga quando o
      # repositorio pertence a uma organizacao, e falhava com "missing gitleaks
      # license" — barrando todo merge por erro de licenca, nao por vazamento.
      # O gitleaks em si e open source e roda sem licenca nenhuma.
      - id: gitleaks
        continue-on-error: true
        # Teto no PASSO, nao no job: com continue-on-error o passo que estoura
        # vira "falhou" e o job segue — sem SARIF, o gate ja trata como
        # ferramenta quebrada e nao barra. Sem este teto, um repositorio de
        # historico grande segurou o runner por 22 min ate ser morto por fora,
        # e o job inteiro ficou vermelho por causa do gitleaks, nao de segredo.
        timeout-minutes: 12
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          E_FORK: ${{ github.event.repository.fork }}
        run: |
          VER=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          # Varrer o historico inteiro a cada push custava 14 minutos por
          # repositorio e monopolizava um dos quatro runners. O que muda num
          # push sao os commits novos — e o historico antigo ja foi varrido no
          # push anterior. Entao:
          #   push / PR  → so o intervalo novo  (segundos)
          #   schedule / dispatch → historico completo (a auditoria periodica)
          #   fork → so a arvore de trabalho: o historico e do upstream, e
          #          chave de exemplo em fixture de projeto alheio nao e
          #          vazamento nosso. Era isso que barrava 19 repos no gate.
          ESCOPO=()
          if [[ "$E_FORK" == "true" ]]; then
            ESCOPO=(--no-git); echo "fork: varrendo so a arvore de trabalho"
          elif [[ "$EVENTO" == "pull_request" && -n "$BASE_PR" ]]; then
            ESCOPO=(--log-opts="$BASE_PR..HEAD"); echo "PR: varrendo $BASE_PR..HEAD"
          elif [[ "$EVENTO" == "push" && -n "$ANTES" && "$ANTES" != 0000000000000000000000000000000000000000 ]] \
               && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            ESCOPO=(--log-opts="$ANTES..HEAD"); echo "push: varrendo $ANTES..HEAD"
          elif [[ "$EVENTO" == "workflow_dispatch" ]]; then
            # Dispatch e "roda de novo agora", nao auditoria: quem roda a mao
            # quer resultado em minutos. A varredura completa fica para o
            # schedule. 500 commits cobrem meses de qualquer repositorio daqui.
            ESCOPO=(--log-opts="-n 500"); echo "dispatch: varrendo os ultimos 500 commits"
          else
            echo "historico completo (${EVENTO})"
          fi
          /tmp/gitleaks detect --source . --no-banner "${ESCOPO[@]}" \
            --report-format sarif --report-path results.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks
          path: results.sarif
          if-no-files-found: ignore

  dependencias:
    name: dependências vulneráveis
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      # O binario, nao a acao. trivy-action resolve a versao por um arquivo de
      # metadados no repositorio dela, e toda tag que testei devolveu "Missing
      # download info" — uma dependencia externa a mais para uma ferramenta que
      # e um binario estatico.
      - name: trivy (sistema de arquivos)
        run: |
          VER=0.74.0
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" \
            | tar xz -C /tmp trivy
          # --exit-code 0 significa que achado nunca reprova; logo, saida
          # diferente de zero aqui e falha da ferramenta ou do ambiente, nao do
          # repositorio. O caso comum e o Maven Central responder 429 quando
          # varios repositorios sao varridos em sequencia. Tenta de novo sem
          # consulta remota e, se ainda quebrar, avisa em vez de reprovar
          # codigo que nunca chegou a ser analisado.
          varrer() {
            /tmp/trivy fs . --scanners vuln,secret,misconfig \
              --severity CRITICAL,HIGH --format sarif --output trivy.sarif \
              --exit-code 0 --no-progress "$@"
          }
          if ! varrer; then
            echo "::notice::trivy falhou; repetindo sem consulta remota"
            if ! varrer --offline-scan; then
              echo "::warning::trivy nao concluiu (falha de ferramenta ou rede, nao achado)"
              rm -f trivy.sarif
            fi
          fi
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: trivy, path: trivy.sarif, if-no-files-found: ignore }

  sonar:
    name: qualidade (SonarQube)
    # Informa, nao trava: a decisao e do dono do repositorio, e um gate ligado
    # antes de a fila de achados ser zerada so ensina a ignorar o gate.
    continue-on-error: true
    if: inputs.sonar_host != ''
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # v6 porque a v4 saiu de suporte e o proprio run avisa que ela carrega
      # uma vulnerabilidade. Um scanner de seguranca desatualizado e a pior
      # forma de dividas: ele passa verde enquanto e a propria porta aberta.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: ${{ inputs.sonar_host }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Havendo .java, o sensor Java aborta a analise inteira se nao
          # receber sonar.java.binaries — e a pipeline nao compila nada, entao
          # nao ha classes para apontar. Indicar a raiz satisfaz a exigencia e
          # deixa o restante (Python, JS, Terraform, YAML) ser analisado; sem
          # isso um unico arquivo Java derruba a varredura do repositorio todo.
          args: >
            -Dsonar.projectKey=${{ inputs.product_name }}
            -Dsonar.projectName=${{ inputs.product_name }}
            -Dsonar.java.binaries=.

  consolida:
    name: envia ao DefectDojo
    # Idem: o envio e telemetria. DefectDojo fora do ar nao pode reprovar
    # codigo que ninguem chegou a analisar.
    continue-on-error: true
    if: inputs.defectdojo_host != '' && always()
    needs: [segredos, dependencias]
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/download-artifact@v8
        with: { path: relatorios }
      - name: importa os achados
        env:
          DD_HOST: ${{ inputs.defectdojo_host }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
        run: |
          set -uo pipefail
          # O prefixo do nome e a taxonomia da org (app-, svc-, tool-, ref-,
          # lab-, lib-, infra-, dot-). Vira o Product Type no DefectDojo; sem
          # isso o auto_create joga tudo em "Research and Development".
          case "${{ inputs.product_name }}" in
            app-*) TIPO="Aplicações" ;;    svc-*) TIPO="Serviços" ;;
            tool-*) TIPO="Ferramentas" ;;  ref-*) TIPO="Referência" ;;
            lab-*) TIPO="Laboratório" ;;   lib-*) TIPO="Bibliotecas" ;;
            infra-*) TIPO="Infraestrutura" ;; dot-*) TIPO="Dotfiles" ;;
            platform*) TIPO="Plataforma" ;; *) TIPO="Outros" ;;
          esac
          enviar() { # <arquivo> <tipo no DefectDojo>
            [[ -f "$1" ]] || { echo "sem $1 — nada a enviar"; return 0; }
            curl -sS -X POST "$DD_HOST/api/v2/import-scan/" \
              -H "Authorization: Token $DD_TOKEN" \
              -F "scan_type=$2" -F "file=@$1" \
              -F "product_name=${{ inputs.product_name }}" \
              -F "product_type_name=$TIPO" \
              -F "engagement_name=CI" -F "auto_create_context=true" \
              -F "active=true" -F "verified=false" \
              -F "branch_tag=${{ github.ref_name }}" \
              -F "commit_hash=${{ github.sha }}" \
              -o /dev/null -w "  $2 → HTTP %{http_code}\n"
          }
          enviar relatorios/trivy/trivy.sarif "SARIF"
          enviar relatorios/gitleaks/results.sarif "SARIF"

  gate:
    name: bloqueio
    needs: [segredos, dependencias]
    if: always()
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with: { path: relatorios }
      - name: só segredo vazado barra o merge
        env:
          # Quem e "dono da conta" para o gate: nome e e-mail como o git grava.
          DONOS: "fernandofatech,fernandofa89@gmail.com,Fernando Francisco Azevedo,Fernando Azevedo"
        run: |
          # `vazou` vem do outcome do gitleaks, que sai diferente de zero tanto
          # ao achar segredo quanto ao falhar sozinho. Barrar merge por
          # ferramenta quebrada ensina a ignorar o gate, entao o relatorio
          # decide: sem SARIF com achado, nao ha o que barrar.
          if [[ "${{ needs.segredos.outputs.vazou }}" != "true" ]]; then
            echo "sem segredo vazado; demais achados estão no relatório e no DefectDojo"
            exit 0
          fi
          if [[ ! -s relatorios/gitleaks/results.sarif ]]; then
            echo "::warning::gitleaks terminou em erro sem produzir relatório — não vou barrar o merge por falha de ferramenta"
            exit 0
          fi
          # So barra segredo que e NOSSO. Boa parte da frota e copia de projeto
          # alheio (litellm, langgraph, web-check...) e vem com fixture de teste,
          # exemplo de doc e ate chave real de autor upstream de anos atras. Nada
          # disso e nosso para rotacionar, e barrar por isso rendeu uma tarde de
          # allowlist repo a repo. O gitleaks grava autor e e-mail de cada achado
          # no SARIF; se nenhum for de um dono da conta, o achado vai para o
          # relatorio e o DefectDojo, mas o merge segue. Autor e facil de forjar
          # — para uma frota pessoal, e o risco certo a aceitar.
          python3 - "$DONOS" <<'PY'
          import json, sys
          donos = {d.strip().lower() for d in sys.argv[1].split(",") if d.strip()}
          nossos, alheios = [], []
          for run in json.load(open("relatorios/gitleaks/results.sarif")).get("runs", []):
              for r in run.get("results", []):
                  fp = r.get("partialFingerprints", {})
                  quem = {fp.get("author", "").lower(), fp.get("email", "").lower()}
                  loc = r["locations"][0]["physicalLocation"]
                  onde = f"{loc['artifactLocation']['uri']}:{loc['region'].get('startLine', '?')} ({fp.get('commitSha', '')[:8]}, {fp.get('author', '?')})"
                  (nossos if quem & donos else alheios).append(onde)
          for o in alheios[:10]:
              print(f"::warning::achado de autor upstream, não barra: {o}")
          if len(alheios) > 10:
              print(f"::warning::… e mais {len(alheios) - 10} achados de autores upstream")
          if not nossos:
              print(f"{len(alheios)} achado(s), nenhum de dono da conta — não barro o merge")
              sys.exit(0)
          for o in nossos:
              print(f"::error::segredo commitado por dono da conta: {o}")
          print("::error::rotacione a credencial ANTES de remover o commit — o histórico já está exposto")
          sys.exit(1)
          PY

  # Um relatório que exige abrir seis jobs para ser lido não é um relatório.
  # Este job junta tudo na página do próprio run: quais etapas passaram, o que
  # cada SARIF encontrou, o quality gate do Sonar e a fila aberta no DefectDojo.
  #
  # NUNCA reprova — quem barra é o job `gate`. Todo `continue-on-error` aqui é
  # deliberado: relatório que derruba run vira relatório que se desliga.
  resumo:
    name: resumo do run
    needs: [segredos, dependencias, sonar, consolida, gate]
    if: always()
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      # O script mora aqui mesmo, neste repositório: em arquivo .py de verdade
      # ele é testável fora do CI, coisa que heredoc dentro de YAML não é.
      - uses: actions/checkout@v7
        with:
          repository: fernando-moretes/platform-workflows
          ref: main
          path: .orquestrador
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with: { path: relatorios }
      - name: monta o resumo
        continue-on-error: true
        env:
          DIR_RELATORIOS: relatorios
          PRODUTO: ${{ inputs.product_name }}
          SONAR_HOST: ${{ inputs.sonar_host }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DD_HOST: ${{ inputs.defectdojo_host }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          R_SEGREDOS: ${{ needs.segredos.result }}
          R_DEPS: ${{ needs.dependencias.result }}
          R_SONAR: ${{ needs.sonar.result }}
          R_DD: ${{ needs.consolida.result }}
          R_GATE: ${{ needs.gate.result }}
        run: |
          command -v python3 >/dev/null || {
            echo "::warning::sem python3 no runner — resumo não gerado"; exit 0; }
          python3 .orquestrador/scripts/resumo-seguranca.py
