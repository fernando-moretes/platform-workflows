# Portaria do PR: título, branch e tamanho.
#
# Roda antes de qualquer build porque falha de convenção custa segundos e falha
# de build custa minutos — e um título fora do padrão quebra o versionamento
# automático lá na frente, quando o release já está sendo cortado.
name: pr-lint

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner em JSON. O padrao e o self-hosted do homelab: minuto de
          self-hosted e gratuito e nao consome a cota de 2.000/mes do GitHub.
        type: string
        default: '["self-hosted","homelab"]'
      max_changed_files:
        description: Acima disto o PR recebe um aviso (não bloqueia)
        type: number
        default: 50

# Nada de `pull-requests` aqui, nem read. O repositorio roda com
# `default_workflow_permissions: read`, que trava pull-requests em `none` — e o
# GitHub valida o que cada reusable workflow PEDE ao ler o arquivo, antes de
# qualquer `if:`. Pedir uma permissao que o teto nao concede derrubava TODO PR
# em startup_failure, sem rodar lint nem CI, humano ou bot.
#
# O titulo vem do payload do evento, entao nao ha API a chamar nem permissao a
# pedir. Baixar o teto e a correcao certa; afrouxar o teto do repositorio para
# checar um titulo seria pagar caro por pouco.
permissions:
  contents: read

jobs:
  titulo:
    name: título segue Conventional Commits
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      # Regex no shell, e nao a action-semantic-pull-request: a action fala com
      # a API do PR e por isso exige `pull-requests: read`, permissao que o teto
      # do repositorio nao concede. O titulo ja chega inteiro no payload, e o
      # job de branch logo abaixo valida do mesmo jeito — uma dependencia
      # externa a menos para conferir uma string.
      - name: valida o título
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          TIPOS="feat|fix|chore|docs|test|refactor|ci|style|perf|build|revert"
          if [[ ! "$TITULO" =~ ^($TIPOS)(\([a-z0-9._/-]+\))?!?:\ .+$ ]]; then
            echo "::error::título '$TITULO' fora de Conventional Commits"
            echo "Esperado: <tipo>(escopo opcional): descrição"
            echo "Tipos aceitos: ${TIPOS//|/, }"
            exit 1
          fi
          DESCRICAO="${TITULO#*: }"
          # O merge do PR vira o commit em main, e e dele que a versao sai.
          if [[ "$DESCRICAO" =~ ^[A-Z] ]]; then
            echo "::error::a descrição precisa começar em minúscula"
            exit 1
          fi
          if [[ "$DESCRICAO" == *. ]]; then
            echo "::error::a descrição não termina com ponto"
            exit 1
          fi
          echo "título ok: $TITULO"

  branch:
    name: nome do branch segue a convenção
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: valida o prefixo
        run: |
          BRANCH="${{ github.head_ref }}"
          # `dependabot/...` entra na lista porque o nome e gerado pelo bot e
          # nao ha como faze-lo seguir a convencao. Guardar o job por
          # `github.actor` seria pior: quem reabre um PR do dependabot vira o
          # actor, o guard nao pega e a checagem reprova um branch que ela
          # deveria aceitar.
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "branch '$BRANCH' gerado pelo dependabot — convenção não se aplica"
            exit 0
          fi
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs|hotfix|refactor|test|ci)/[a-z0-9._-]+$ ]]; then
            echo "::error::branch '$BRANCH' fora do padrão <tipo>/<escopo-em-kebab-case>"
            echo "Tipos aceitos: feat, fix, chore, docs, hotfix, refactor, test, ci"
            exit 1
          fi
          echo "branch '$BRANCH' ok"

  tamanho:
    name: tamanho do PR
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: conta arquivos alterados
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l | tr -d ' ')
          echo "arquivos alterados: $CHANGED"
          if [[ "$CHANGED" -gt ${{ inputs.max_changed_files }} ]]; then
            echo "::warning::PR com $CHANGED arquivos alterados. PR grande demora a ser revisado e esconde o que importa — considere fatiar."
          fi
