# Gerado por fernando-moretes/platform (TechDocs do Backstage). O conteudo e do
# repositorio: escreva em docs/*.md; este arquivo so lista as paginas.
site_name: platform-workflows
site_description: "Workflows reutilizaveis das pipelines"
repo_url: https://github.com/fernando-moretes/platform-workflows
edit_uri: edit/main/docs/
docs_dir: docs
plugins:
  - techdocs-core
nav:
  - Visão geral: index.md
  - Arquitetura: arquitetura.md
  - Operação: operacao.md
  - API: api.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
