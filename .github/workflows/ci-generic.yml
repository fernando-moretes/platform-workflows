# CI para repositório sem stack reconhecida: conteúdo, HCL, docs, shell.
#
# Existe para que nenhum repositório fique sem sinal nenhum. Verifica o que dá
# para verificar sem saber a linguagem — e isso já pega link quebrado, YAML
# inválido e script com erro de sintaxe.
name: ci-generic

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner em JSON. O padrao e o self-hosted do homelab: minuto de
          self-hosted e gratuito e nao consome a cota de 2.000/mes do GitHub.
        type: string
        default: '["self-hosted","homelab"]'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v4

      - name: YAML e JSON válidos
        run: |
          erros=0

          # O parser precisa existir antes de julgar o conteudo. Sem esta guarda
          # um runner sem pyyaml reprova TODO arquivo YAML do repositorio, e o
          # erro aparece como se fosse do codigo em vez da ferramenta ausente.
          if ! python3 -c "import yaml" 2>/dev/null; then
            pip install --quiet --disable-pip-version-check pyyaml 2>/dev/null || true
          fi

          if python3 -c "import yaml" 2>/dev/null; then
            while IFS= read -r f; do
              # Arquivo vazio nao tem sintaxe para estar errada. Placeholder vazio
              # e comum — o acme.json do Traefik nasce assim e so e preenchido em
              # runtime — e reprovar isso e falso positivo.
              [[ -s "$f" ]] || continue
              # O nome vai por argv: caminho com aspas quebraria a interpolacao.
              # safe_load recusa tags proprias de ferramenta (!!python/name: do
              # mkdocs, !Ref/!GetAtt do CloudFormation). O arquivo e valido; so
              # nao e "seguro" no sentido do safe_load. Ignorar tag desconhecida
              # preserva a checagem de sintaxe sem inventar falso positivo.
              if ! saida=$(python3 -c "import yaml,sys; yaml.SafeLoader.add_multi_constructor('', lambda l,s,n: None); yaml.safe_load(open(sys.argv[1]))" "$f" 2>&1); then
                echo "::error file=$f::YAML invalido: $(echo "$saida" | tail -1)"
                erros=1
              fi
            done < <(find . -path ./.git -prune -o \( -name '*.yml' -o -name '*.yaml' \) -print)
          else
            echo "::warning::pyyaml indisponivel no runner - validacao de YAML pulada"
          fi

          while IFS= read -r f; do
            # Arquivo vazio nao tem sintaxe para estar errada. Placeholder vazio
            # e comum — o acme.json do Traefik nasce assim e so e preenchido em
            # runtime — e reprovar isso e falso positivo.
            [[ -s "$f" ]] || continue
            if ! saida=$(python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>&1); then
              echo "::error file=$f::JSON invalido: $(echo "$saida" | tail -1)"
              erros=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.json' -print)

          exit $erros

      - name: sintaxe dos scripts shell
        if: always()
        run: |
          erros=0
          while IFS= read -r f; do
            # Arquivo vazio nao tem sintaxe para estar errada. Placeholder vazio
            # e comum — o acme.json do Traefik nasce assim e so e preenchido em
            # runtime — e reprovar isso e falso positivo.
            [[ -s "$f" ]] || continue
            bash -n "$f" 2>/dev/null && continue
            # Nem todo .sh e bash: oh-my-zsh e afins usam sintaxe de zsh, que o
            # bash recusa com razao. Antes de acusar erro, confirmar com o zsh;
            # so e erro de verdade se nenhum dos dois conseguir ler o arquivo.
            if command -v zsh >/dev/null && zsh -n "$f" 2>/dev/null; then
              echo "::notice file=$f::sintaxe de zsh, nao de bash"
              continue
            fi
            echo "::error file=$f::erro de sintaxe: $(bash -n "$f" 2>&1 | head -1)"
            erros=1
          done < <(find . -path ./.git -prune -o -name '*.sh' -print)
          exit $erros

      - name: Terraform/OpenTofu formatado
        if: always()
        run: |
          if compgen -G "**/*.tf" > /dev/null || compgen -G "*.tf" > /dev/null; then
            # Sob `set -e` a instalacao falhando derruba o passo inteiro e o
            # resultado aparece como problema do repositorio. Formatacao de
            # Terraform e aviso, nunca motivo de reprovacao — muito menos
            # quando a ferramenta nem chegou a rodar.
            if curl -fsSL https://get.opentofu.org/install-opentofu.sh | bash -s -- --install-method standalone >/dev/null 2>&1 && command -v tofu >/dev/null; then
              tofu fmt -check -recursive . || echo "::warning::arquivos .tf fora do formato — rode 'tofu fmt -recursive .'"
            else
              echo "::warning::nao consegui instalar o OpenTofu — formatacao nao verificada"
            fi
          else
            echo "::notice::sem arquivos Terraform"
          fi

      - name: links do README
        if: always()
        run: |
          [[ -f README.md ]] || { echo "::warning::repositório sem README.md"; exit 0; }
          quebrados=0
          grep -oE 'https?://[^)"< ]+' README.md | sort -u | while read -r url; do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' -L "$url" || echo 000)
            [[ "$code" =~ ^(2|3) ]] || echo "::warning::link possivelmente quebrado ($code): $url"
          done
          exit 0
