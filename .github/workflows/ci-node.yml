# CI para projetos Node/TypeScript.
#
# Cada etapa roda mesmo se a anterior falhar (`if: always()`), porque saber que
# há três problemas de uma vez vale mais do que descobrir um por execução.
name: ci-node

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner em JSON. O padrao e o self-hosted do homelab: minuto de
          self-hosted e gratuito e nao consome a cota de 2.000/mes do GitHub.
        type: string
        default: '["self-hosted","homelab"]'
      node_version:
        type: string
        default: "22"
      package_manager:
        description: npm, pnpm, yarn ou auto
        type: string
        default: auto
      run_build:
        type: boolean
        default: true
      working_directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runner) }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: detecta o gerenciador de pacotes
        id: pm
        run: |
          # Nem todo repositorio roteado para esta pipeline e um projeto Node:
          # repositorio de documentacao ou de referencia nao tem package.json, e
          # `npm install` ali morre com ENOENT antes de qualquer verificacao. Sem
          # manifesto, os passos de Node nao tem o que fazer e sao pulados.
          if [[ -f package.json ]]; then
            echo "pkg=sim" >> "$GITHUB_OUTPUT"
          else
            echo "pkg=" >> "$GITHUB_OUTPUT"
            echo "::notice::sem package.json — etapas de Node puladas"
          fi
          PM="${{ inputs.package_manager }}"
          if [[ "$PM" == "auto" ]]; then
            if   [[ -f pnpm-lock.yaml ]]; then PM=pnpm
            elif [[ -f yarn.lock ]];      then PM=yarn
            else                               PM=npm; fi
          fi
          echo "pm=$PM" >> "$GITHUB_OUTPUT"
          # `packageManager` no package.json fixa a versao, e a action recusa
          # receber as duas: "Multiple versions of pnpm specified". Quem manda e
          # o repositorio — versao fixada aqui envelhece e quebra o CI de quem
          # subir o pnpm, que foi exatamente o que aconteceu com pnpm@11.
          # A versao sai daqui pronta, e nao de um ternario na expressao do
          # Actions: la, `cond && '' || '9'` devolve '9', porque string vazia e
          # falsy e o `||` sempre entra. No shell, vazio e vazio.
          if [[ -f package.json ]] && grep -q '"packageManager"' package.json; then
            echo "pnpm_ver=" >> "$GITHUB_OUTPUT"
            echo "::notice::versao do pnpm vem do packageManager do package.json"
          else
            echo "pnpm_ver=9" >> "$GITHUB_OUTPUT"
          fi
          # O cache do setup-node aponta para o lockfile; sem lockfile a acao
          # falha com "Some specified paths were not resolved" e derruba o job
          # inteiro por uma otimizacao que nem era possivel. So liga o cache
          # quando existe de fato o que cachear.
          if compgen -G "*lock*" > /dev/null; then
            echo "lock=sim" >> "$GITHUB_OUTPUT"
          else
            echo "lock=" >> "$GITHUB_OUTPUT"
            echo "::notice::sem lockfile — cache de dependencias desligado"
          fi
          echo "gerenciador: $PM"

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.pkg == 'sim' && steps.pm.outputs.pm == 'pnpm'
        with:
          # Vazio = a action le o packageManager do package.json. So vem "9"
          # quando o repositorio nao fixa versao nenhuma.
          version: ${{ steps.pm.outputs.pnpm_ver }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.pm.outputs.lock == 'sim' && steps.pm.outputs.pm || '' }}
          cache-dependency-path: ${{ steps.pm.outputs.lock == 'sim' && format('{0}/*lock*', inputs.working_directory) || '' }}

      - name: instala
        id: instala
        if: steps.pm.outputs.pkg == 'sim'
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            # `npm ci` exige lockfile; sem ele o install comum é o caminho.
            npm)  [[ -f package-lock.json ]] && npm ci || npm install ;;
          esac

      - name: lint
        id: lint
        if: always() && steps.pm.outputs.pkg == 'sim' && steps.instala.outcome == 'success'
        run: |
          if npm run | grep -qE '^  lint'; then
            ${{ steps.pm.outputs.pm }} run lint
          else
            echo "::notice::sem script 'lint' no package.json — etapa pulada"
          fi

      - name: typecheck
        id: typecheck
        if: always() && steps.pm.outputs.pkg == 'sim' && steps.instala.outcome == 'success'
        run: |
          if npm run | grep -qE '^  typecheck'; then
            ${{ steps.pm.outputs.pm }} run typecheck
          elif [[ -f tsconfig.json ]]; then
            npx --yes tsc --noEmit
          else
            echo "::notice::projeto sem TypeScript — etapa pulada"
          fi

      - name: testes
        id: testes
        if: always() && steps.pm.outputs.pkg == 'sim' && steps.instala.outcome == 'success'
        run: |
          if npm run | grep -qE '^  test'; then
            ${{ steps.pm.outputs.pm }} run test
          else
            echo "::notice::sem script 'test' — etapa pulada"
          fi

      - name: build
        id: build
        if: always() && inputs.run_build && steps.pm.outputs.pkg == 'sim' && steps.instala.outcome == 'success'
        run: |
          if npm run | grep -qE '^  build'; then
            ${{ steps.pm.outputs.pm }} run build
          else
            echo "::notice::sem script 'build' — etapa pulada"
          fi

      # Sem isto, saber se o lint passou exige abrir o job e rolar o log. O
      # `if: always()` de cada etapa acima só tem valor se o desfecho das cinco
      # aparecer junto — que é o ponto de rodar todas mesmo com uma falhando.
      - name: resumo do CI
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## 🧪 CI — ${{ github.event.repository.name }}"
            echo
            echo "Node ${{ inputs.node_version }} · \`${{ steps.pm.outputs.pm }}\` · runner \`${{ runner.name }}\`"
            echo
            if [[ "${{ steps.pm.outputs.pkg }}" != "sim" ]]; then
              echo "> Sem \`package.json\` — este repositório não é um projeto Node e as etapas foram puladas."
            else
              echo "| etapa | resultado |"
              echo "|---|---|"
              linha() { # <rótulo> <outcome>
                case "$2" in
                  success)  echo "| $1 | ✅ passou |" ;;
                  failure)  echo "| $1 | ❌ **falhou** |" ;;
                  skipped)  echo "| $1 | ⏭️ pulada |" ;;
                  *)        echo "| $1 | ⚪ \`${2:-?}\` |" ;;
                esac
              }
              linha "instala"   "${{ steps.instala.outcome }}"
              linha "lint"      "${{ steps.lint.outcome }}"
              linha "typecheck" "${{ steps.typecheck.outcome }}"
              linha "testes"    "${{ steps.testes.outcome }}"
              linha "build"     "${{ steps.build.outcome }}"
              echo
              if [[ "${{ steps.instala.outcome }}" != "success" ]]; then
                echo "> ⚠️ **A instalação não passou, então lint, typecheck, testes e build nem rodaram.**"
                echo "> Nada aqui foi verificado nesta execução — verde nas outras linhas seria mentira."
              else
                echo "_Etapa pulada aqui significa script ausente no \`package.json\`, não sucesso._"
              fi
            fi
            echo
            echo "commit [\`${GITHUB_SHA:0:8}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) · \`${{ github.ref_name }}\` · por **${{ github.actor }}**"
          } >> "$GITHUB_STEP_SUMMARY"
